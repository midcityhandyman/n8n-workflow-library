name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate the workflow library
        run: python -m n8n_validator validate workflows
      - name: Generated files are in sync
        run: python tools/build_workflows.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline demo
        run: python demo/run_demo.py
